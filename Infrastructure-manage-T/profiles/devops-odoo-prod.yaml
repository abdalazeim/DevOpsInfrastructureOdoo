profile_name: devops-odoo-prod
description: Live production Ubuntu host with Let's Encrypt TLS and isolated DBs
version: 1.0.0
server:
  hostname: devops-odoo
  ip_or_host: 203.0.113.50
  timezone: Asia/Riyadh
  ssh_user: ubuntu
  ssh_port: 22
paths:
  project_root: /opt/odoo-infrastructure-manager
  data_root: /opt/odoo-infrastructure
  backup_root: /opt/odoo-infrastructure/backups
network:
  proxy_network_name: proxy
  proxy_subnet: 172.28.0.0/16
  enable_ipv6: false
traefik:
  enabled: true
  image: traefik:v3.7
  dashboard_enabled: true
  dashboard_domain: traefik.devops-odoo.internal
  acme_email: devops@localhost
  acme_challenge: http
  http_port: 80
  https_port: 443
odoo17:
  enabled: true
  domain: odoo17.devops-odoo.internal
  image: odoo:17.0
  workers: 4
  memory_limit_soft: '2147483648'
  memory_limit_hard: '2684354560'
  database:
    engine: postgres:16-alpine
    name: odoo17_prod
    user: odoo17_user
    password_env_var: ODOO17_DB_PASSWORD
    admin_password_env_var: ODOO17_ADMIN_PASSWORD
    internal_port: 5432
    expose_public_port: false
odoo18:
  enabled: true
  domain: odoo18.devops-odoo.internal
  image: odoo:18.0
  workers: 4
  memory_limit_soft: '2147483648'
  memory_limit_hard: '2684354560'
  database:
    engine: postgres:17-alpine
    name: odoo18_prod
    user: odoo18_user
    password_env_var: ODOO18_DB_PASSWORD
    admin_password_env_var: ODOO18_ADMIN_PASSWORD
    internal_port: 5432
    expose_public_port: false
odoo19:
  enabled: true
  domain: odoo19.devops-odoo.internal
  image: odoo:19.0
  workers: 4
  memory_limit_soft: '3221225472'
  memory_limit_hard: '4294967296'
  database:
    engine: postgres:18-alpine
    name: odoo19_prod
    user: odoo19_user
    password_env_var: ODOO19_DB_PASSWORD
    admin_password_env_var: ODOO19_ADMIN_PASSWORD
    internal_port: 5432
    expose_public_port: false
backup:
  enabled: true
  cron_schedule: 0 3 * * *
  retention_count: 14
  include_filestore: true
  compression: gzip
  verify_checksum: true
security:
  strict_file_permissions: true
  acme_mode_600: true
  isolate_postgres_network: true
  enforce_https: true
