# ==============================================================================
# Odoo 18 + PostgreSQL 17 - Standalone Compose (minhng92 style)
#
# Copied by automation/scripts/install-odoo.sh into /opt/odoo-infrastructure/odoo18
# together with postgresql/, addons/, etc/odoo.conf, entrypoint.sh and .env.
#
# Direct access (no reverse proxy):
#   http://localhost:10018  (web)
#   http://localhost:20018  (live chat / longpolling)
# ==============================================================================
name: odoo18

services:
  db:
    container_name: odoo18-db
    image: ${PG_IMAGE:-postgres:17}
    user: root
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=postgres
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    networks:
      - internal

  odoo18:
    container_name: odoo18
    image: ${ODOO_IMAGE:-odoo:18}
    user: root
    depends_on:
      - db
    restart: always
    tty: true
    command: ["--config=/etc/odoo/odoo.conf"]
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PIP_BREAK_SYSTEM_PACKAGES=1
    ports:
      - "${ODOO_HTTP_PORT:-10018}:8069"
      - "${ODOO_CHAT_PORT:-20018}:8072" # live chat
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    networks:
      - internal

networks:
  internal:
    name: ${ODOO_NETWORK:-odoo18_internal}
    driver: bridge
