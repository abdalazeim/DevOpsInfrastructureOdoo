[options]
; ==============================================================================
; Odoo 17 - Traefik / production configuration (rendered by install-odoo.sh)
;
; Used with docker-compose.traefik.yml. Odoo is reached only through Traefik
; over HTTPS, so the database manager is hidden and proxy_mode is enabled.
; ==============================================================================
admin_passwd = ${ODOO_ADMIN_PASSWORD}
db_host = db
db_port = 5432
db_user = ${ODOO_DB_USER}
db_password = ${ODOO_DB_PASSWORD}
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

list_db = False
proxy_mode = True

; Logging
log_level = info
logfile = False
log_handler = :INFO

; Resource limits
workers = 3
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
