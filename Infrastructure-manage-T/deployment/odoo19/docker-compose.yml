# ==============================================================================
# Odoo 19 + PostgreSQL 18 - Standalone Compose (minhng92 style)
#
# Copied by automation/scripts/install-odoo.sh into /opt/odoo-infrastructure/odoo19
# together with postgresql/, addons/, etc/odoo.conf, entrypoint.sh and .env.
#
# Direct access (no reverse proxy):
#   http://localhost:10019  (web)
#   http://localhost:20019  (live chat / longpolling)
# ==============================================================================
name: odoo19

services:
  db:
    container_name: odoo19-db
    image: ${PG_IMAGE:-postgres:18}
    user: root
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=postgres
    volumes:
      # PostgreSQL 18 changed PGDATA to a version-specific path.
      - ./postgresql:/var/lib/postgresql/18/docker
    networks:
      - internal

  odoo19:
    container_name: odoo19
    image: ${ODOO_IMAGE:-odoo:19}
    user: root
    depends_on:
      - db
    restart: always
    tty: true
    command: ["--config=/etc/odoo/odoo.conf"]
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PIP_BREAK_SYSTEM_PACKAGES=1
    ports:
      - "${ODOO_HTTP_PORT:-10019}:8069"
      - "${ODOO_CHAT_PORT:-20019}:8072" # live chat
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    networks:
      - internal

networks:
  internal:
    name: ${ODOO_NETWORK:-odoo19_internal}
    driver: bridge
