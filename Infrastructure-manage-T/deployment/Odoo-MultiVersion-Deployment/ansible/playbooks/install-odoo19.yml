# Odoo Multi-Version Deployment - Playbook: install-odoo19.yml
- name: Install Odoo 19 Multi-Instance
  hosts: odoo_host
  become: true
  vars:
    odoo_version: "19"
    postgres_version: "18"
    odoo_image: "odoo:19"
    postgres_image: "postgres:18"
    docker_compose_template: "docker/odoo19-compose.yml.j2"
  pre_tasks:
    - name: Include instance variables
      ansible.builtin.include_vars:
        file: versions/odoo19.yml
  roles:
    - system
    - docker
    - postgresql
    - odoo
    - traefik