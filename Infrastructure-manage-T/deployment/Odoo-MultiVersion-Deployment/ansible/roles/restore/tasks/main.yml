- name: Require explicit restore authorization
  ansible.builtin.assert:
    that: confirm_restore | default(false) | bool
    fail_msg: "Set confirm_restore=true after reviewing database replacement"

- name: Allocate private helper on target
  become: true
  ansible.builtin.tempfile:
    state: file
    suffix: _odoo_backup.py
  register: backup_helper

- name: Run verified backup contract
  become: true
  block:
    - name: Copy standalone backup engine
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../../app/services/instance_backup.py"
        dest: "{{ backup_helper.path }}"
        mode: '0700'
    - name: Execute restore
      ansible.builtin.command:
        argv:
          - python3
          - "{{ backup_helper.path }}"
          - restore
          - --confirm-replace
          - "{{ backup_root }}/odoo{{ odoo_version | string | regex_replace('^odoo', '') }}/{{ instance_name }}/{{ backup_id }}"
          - --root
          - "{{ backup_root }}"
  always:
    - name: Remove helper
      ansible.builtin.file:
        path: "{{ backup_helper.path }}"
        state: absent
