---
- name: Allocate private helper on target
  become: true
  ansible.builtin.tempfile:
    state: file
    suffix: _odoo_backup.py
  register: backup_helper

- name: Run verified backup contract
  become: true
  block:
    - name: Copy standalone backup engine
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../../app/services/instance_backup.py"
        dest: "{{ backup_helper.path }}"
        mode: '0700'
    - name: Execute backup
      ansible.builtin.command:
        argv:
          - python3
          - "{{ backup_helper.path }}"
          - backup
          - "odoo{{ odoo_version | string | regex_replace('^odoo', '') }}"
          - "{{ item.name }}"
          - --root
          - "{{ backup_root }}"
      loop: "{{ odoo_instances }}"
      when: instance_name is not defined or item.name == instance_name
  always:
    - name: Remove helper
      ansible.builtin.file:
        path: "{{ backup_helper.path }}"
        state: absent
