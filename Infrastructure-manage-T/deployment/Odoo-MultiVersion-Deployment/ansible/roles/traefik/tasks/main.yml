# Odoo Multi-Version Deployment - Role: traefik
# Traefik reverse proxy configuration and validation

- name: Verify proxy network exists
  become: true
  community.docker.docker_network_info:
    name: "{{ proxy_network }}"
  register: proxy_net_info
  failed_when: not proxy_net_info.exists

- name: Check Traefik container exists
  become: true
  community.docker.docker_container_info:
    name: traefik
  register: traefik_container_info

- name: Display Traefik status
  ansible.builtin.debug:
    msg: "Traefik container status: {{ traefik_container_info.info.State.Status | default('not found') }}"

- name: Verify Traefik is accessible
  become: true
  ansible.builtin.uri:
    url: "http://localhost:8080/api/overview"
    return_content: yes
  register: traefik_api_check
  failed_when: traefik_api_check.status != 200
  ignore_errors: yes