# Odoo Multi-Version Deployment - Backup Policy
# Backup and disaster recovery policy

backup_policy:
  version: "1.0"
  created_at: "2026-11-04"
  updated_at: "2026-11-04"

  # Supported backup types
  backup_types:
    - full
    - database
    - filestore
    - configuration
    - complete-infrastructure
    - pre-update

  # Backup schedule
  schedules:
    daily:
      type: full
      time: "02:00"
      retention_days: 7
    weekly:
      type: full
      time: "02:00"
      day: "sunday"
      retention_weeks: 4
    monthly:
      type: full
      time: "02:00"
      day: 1
      retention_months: 3
    yearly:
      type: full
      time: "02:00"
      day: 1
      month: 1
      retention_years: 1

  # Components included in each backup
  components:
    postgresql:
      enabled: true
      tool: pg_dump
      format: custom
    filestore:
      enabled: true
      tool: tar
      compression: zst
    custom_addons:
      enabled: true
      tool: tar
      compression: zst
    odoo_configuration:
      enabled: true
      tool: tar
      compression: zst
    docker_compose:
      enabled: true
      tool: git
    environment:
      enabled: true
      tool: gpg
      encryption: true
    traefik:
      enabled: true
      tool: tar
      compression: gpg
    ansible:
      enabled: true
      tool: git
    jenkins:
      enabled: true
      tool: jenkins_backup_plugin
    git:
      enabled: true
      tool: git
      track: commit_hash

  # Quality and verification standards
  integrity:
    checksum_algorithm: sha256
    manifest_required: true
    verify_before_restore: true
    test_restore_environment: true

  # Restore policies
  restore:
    safety_backup_before_restore: true
    confirm_required: true
    try_finally_protection: true
    rollback_on_failure: true

  # Notifications
  notifications:
    on_success: true
    on_failure: true
    email: "admin@yourdomain.com"