# Odoo Multi-Version Deployment - Retention Policy
# Backup retention policy

retention_policy:
  version: "1.0"

  # Retention periods by backup type
  retention_periods:
    daily_backups:
      period: "7 days"
      auto_delete: true
    weekly_backups:
      period: "4 weeks"
      auto_delete: true
    monthly_backups:
      period: "3 months"
      auto_delete: true
    yearly_backups:
      period: "1 year"
      auto_delete: true

  # Maximum backups per version
  max_backups_per_instance:
    odoo17:
      instance1: 30
      instance2: 30
    odoo18:
      instance1: 30
      instance2: 30
    odoo19:
      instance1: 30
      instance2: 30

  # Automatic cleanup of old backups
  auto_cleanup:
    enabled: true
    schedule: "weekly"
    time: "03:00"
    day: "monday"
    dry_run_first: true

  # Protected backups
  protected_backups:
    - "pre-update-*"
    - "major-release-*"

  # Multi-tier backup storage
  storage_tiers:
    primary:
      path: "/data/backups"
      type: "local_disk"
      redundancy: "single"
    secondary:
      path: "/data/backups/archive"
      type: "cold_storage"
      redundancy: "redundant"
    offsite:
      enabled: false
      type: "cloud_s3"
      schedule: "monthly"

  # Storage space alerts
  storage_alerts:
    threshold_percent: 85
    action: "notify_admin"
    email: "admin@yourdomain.com"