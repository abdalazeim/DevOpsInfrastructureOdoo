# ==============================================================================
# pgAdmin 4 - Websoft9-style Compose for the Odoo infrastructure
#
# Based on https://github.com/Websoft9/docker-pgadmin:
#   - pgAdmin only (no bundled test PostgreSQL; connect it to the Odoo DBs)
#   - joins the shared external "proxy" network
#   - credentials come from .env (mode 0600), never hardcoded
#
# Run from the repository root:
#   docker compose --env-file .env -f deployment/pgadmin/docker-compose.yml up -d
#
# Direct access: http://localhost:${PGADMIN_HTTP_PORT:-5050}
# ==============================================================================
name: pgadmin

services:
  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required in .env}
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_HTTP_PORT:-5050}:80"
    volumes:
      - ${ODOO_DATA_ROOT:-/opt/odoo-infrastructure}/pgadmin/data:/var/lib/pgadmin
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${DOCKER_PROXY_NETWORK:-proxy}"
      traefik.http.routers.pgadmin.rule: "Host(`${PGADMIN_DOMAIN:-pgadmin.localhost}`)"
      traefik.http.routers.pgadmin.entrypoints: "websecure"
      traefik.http.routers.pgadmin.tls.certresolver: "letsencrypt"
      traefik.http.services.pgadmin.loadbalancer.server.port: "80"

networks:
  proxy:
    external: true
    name: ${DOCKER_PROXY_NETWORK:-proxy}
