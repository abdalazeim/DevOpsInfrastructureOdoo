[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-infrastructure-manager"
version = "1.0.0"
description = "DevOps automation and TUI management tool for multi-version Odoo 17 & 19 on Ubuntu Server with Traefik v3.7 and Docker."
authors = [{ name = "DevOps Team", email = "devops@localhost" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["odoo", "docker", "traefik", "ansible", "devops", "tui", "textual"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "textual>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
odoo-manager = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
