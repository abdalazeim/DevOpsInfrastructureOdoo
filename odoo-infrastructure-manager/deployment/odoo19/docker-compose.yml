services:
  db:
    image: postgres:18
    user: root
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo19@2025
      - POSTGRES_DB=postgres
    restart: always
    volumes:
      - ./postgresql:/var/lib/postgresql/18/docker

  odoo19:
    image: odoo:19
    user: root
    depends_on:
      - db

    ports:
      - "10019:8069"
      - "20019:8072"

    tty: true

    command: ["--proxy-mode"]

    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo19@2025
      - PIP_BREAK_SYSTEM_PACKAGES=1

    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./custom-addons:/mnt/extra-addons
      - ./etc:/etc/odoo

    restart: always

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # Main Odoo Router
      - "traefik.http.routers.odoo19.rule=Host(`odoo19.devops-odoo.com`)"
      - "traefik.http.routers.odoo19.entrypoints=web"
      - "traefik.http.routers.odoo19.service=odoo19"
      - "traefik.http.services.odoo19.loadbalancer.server.port=8069"

      # WebSocket Router
      - "traefik.http.routers.odoo19-websocket.rule=Host(`odoo19.devops-odoo.com`) && PathPrefix(`/websocket`)"
      - "traefik.http.routers.odoo19-websocket.entrypoints=web"
      - "traefik.http.routers.odoo19-websocket.priority=100"
      - "traefik.http.routers.odoo19-websocket.service=odoo19-websocket"
      - "traefik.http.services.odoo19-websocket.loadbalancer.server.port=8072"

    networks:
      - default
      - proxy

networks:
  default:
    driver: bridge

  proxy:
    external: true
    name: proxy
