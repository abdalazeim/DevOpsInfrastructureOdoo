[options]
; ==============================================================================
; Odoo 19 Next-Gen Configuration File
; ==============================================================================
admin_passwd = $__ODOO19_ADMIN_PASSWORD
db_host = odoo19-db
db_port = 5432
db_user = odoo
db_password = $__ODOO19_DB_PASSWORD
db_name = False
dbfilter = .*
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Proxy & Reverse Proxy Settings
proxy_mode = True
workers = 3
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 3221225472
limit_memory_soft = 2684354560
limit_request = 8192

; Logging Configuration
log_level = info
logfile = False
log_handler = :INFO
list_db = True
