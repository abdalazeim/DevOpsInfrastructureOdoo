# ==============================================================================
# docker-compose.prod.yml — Django Enterprise Starter (Production)
# Build from PROJECT ROOT:
#   docker compose -f deployment/docker/docker-compose.prod.yml up -d
# ==============================================================================
# Run from the project root. Set TLS_CERTIFICATE_PATH and
# TLS_CERTIFICATE_KEY_PATH to certificate files available on the Docker host.
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  django:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.prod
    image: django-enterprise:prod
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the deployment environment}
      DEBUG: "False"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with URL-encoded PostgreSQL credentials}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SECURE_HSTS_SECONDS: "31536000"
      RATE_LIMIT_LOGIN: "10/m"
      RATE_LIMIT_API: "60/m"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
      - django_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/app/staticfiles:ro
      - django_media:/app/media:ro
      - ${TLS_CERTIFICATE_PATH:?Set TLS_CERTIFICATE_PATH}:/etc/ssl/certs/server.crt:ro
      - ${TLS_CERTIFICATE_KEY_PATH:?Set TLS_CERTIFICATE_KEY_PATH}:/etc/ssl/private/server.key:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  django_static:
  django_media:
  django_logs:

networks:
  app_network:
    driver: bridge
