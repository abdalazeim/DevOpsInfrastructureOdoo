# ==============================================================================
# docker-compose.yml — Django Enterprise Starter Template (Development)
# Run from deployment/docker/ directory: docker compose up --build
# Source code is mounted from project root (../..) via volume.
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deployment/docker/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deployment/docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/docker/.env}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - enterprise_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_network

  django:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    image: enterprise-django:latest
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ${SECRET_KEY:?Set a local SECRET_KEY in deployment/docker/.env}
      DEBUG: "True"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deployment/docker/.env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8001,http://127.0.0.1:8001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_LOGIN: "30/m"
      RATE_LIMIT_API: "120/m"
    volumes:
      - ../..:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
      - django_logs:/app/logs
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - enterprise_network

volumes:
  postgres_data:
  redis_data:
  django_static:
  django_media:
  django_logs:

networks:
  enterprise_network:
    driver: bridge
