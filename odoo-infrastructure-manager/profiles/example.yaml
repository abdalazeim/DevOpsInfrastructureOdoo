# ==============================================================================
# Odoo Infrastructure Manager - Example Configuration Profile
# ==============================================================================
profile_name: "example-profile"
description: "Standard production configuration template for Odoo 17 & 19"
version: "1.0.0"

server:
  hostname: "devops-odoo"
  ip_or_host: "198.51.100.10"
  timezone: "UTC"
  ssh_user: "devops"
  ssh_port: 22

paths:
  project_root: "/opt/odoo-infrastructure-manager"
  data_root: "/opt/odoo-infrastructure"
  backup_root: "/opt/odoo-infrastructure/backups"

network:
  proxy_network_name: "proxy"
  proxy_subnet: "172.28.0.0/16"
  enable_ipv6: false

traefik:
  enabled: true
  image: "traefik:v3.7"
  dashboard_enabled: true
  dashboard_domain: "traefik.devops-odoo.example.com"
  acme_email: "admin@example.com"
  acme_challenge: "http" # http | tls-alpn
  http_port: 80
  https_port: 443

odoo17:
  enabled: true
  domain: "odoo17.devops-odoo.example.com"
  image: "odoo:17.0"
  workers: 3
  memory_limit_soft: "2147483648"
  memory_limit_hard: "2684354560"
  database:
    engine: "postgres:16-alpine"
    name: "odoo17_prod"
    user: "odoo"
    # Secrets should be loaded from .env: ODOO17_DB_PASSWORD
    password_env_var: "ODOO17_DB_PASSWORD"
    admin_password_env_var: "ODOO17_ADMIN_PASSWORD"
    internal_port: 5432
    expose_public_port: false

odoo19:
  enabled: true
  domain: "odoo19.devops-odoo.example.com"
  image: "odoo:19.0"
  workers: 3
  memory_limit_soft: "2684354560"
  memory_limit_hard: "3221225472"
  database:
    engine: "postgres:18-alpine"
    name: "odoo19_prod"
    user: "odoo"
    # Secrets should be loaded from .env: ODOO19_DB_PASSWORD
    password_env_var: "ODOO19_DB_PASSWORD"
    admin_password_env_var: "ODOO19_ADMIN_PASSWORD"
    internal_port: 5432
    expose_public_port: false

backup:
  enabled: true
  cron_schedule: "0 2 * * *" # Daily at 02:00 AM
  retention_count: 7
  include_filestore: true
  compression: "gzip"
  verify_checksum: true

security:
  strict_file_permissions: true
  acme_mode_600: true
  isolate_postgres_network: true
  enforce_https: true
