# ==============================================================================
# Traefik v3.7 Static Configuration for Odoo Multi-Version Infrastructure
#
# Mounted read-only at /etc/traefik/traefik.yml by docker-compose.yml.
# The ACME e-mail, storage path, and Docker proxy network are supplied from
# .env through CLI flags so this file never contains secrets.
# ==============================================================================
global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "proxy"

certificatesResolvers:
  letsencrypt:
    acme:
      # e-mail is injected via --certificatesresolvers.letsencrypt.acme.email
      storage: "/etc/traefik/acme/acme.json"
      httpChallenge:
        entryPoint: web

log:
  level: INFO
  format: json

accessLog:
  format: json
  bufferingSize: 100
  filters:
    statusCodes:
      - "400-599"
