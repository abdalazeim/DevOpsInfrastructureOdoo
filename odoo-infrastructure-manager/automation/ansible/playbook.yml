---
- name: Configure Ubuntu Server Baseline for Odoo Infrastructure
  hosts: odoo_servers
  become: true
  vars_files:
    - vars/main.yml

  pre_tasks:
    - name: Verify supported Ubuntu distribution (Server & Desktop 22.04+)
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version('22.04', '>=')
        fail_msg: "This playbook supports all Ubuntu Server and Desktop editions from 22.04 LTS upwards."

  roles:
    - role: baseline
      tags: [baseline, system]
    - role: docker
      tags: [docker, containers]

  post_tasks:
    - name: Ensure shared external proxy network exists
      community.docker.docker_network:
        name: "{{ docker_proxy_network | default('proxy') }}"
        driver: bridge
        state: present
        ipam_config:
          - subnet: "172.28.0.0/16"
            gateway: "172.28.0.1"
      tags: [network]

    - name: Display completion summary
      ansible.builtin.debug:
        msg: >
          Server {{ inventory_hostname }} prepared successfully!
          Docker Engine is active. External network '{{ docker_proxy_network | default('proxy') }}' created.
